<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bot Questões</title>
  <style>
    :root {
      --bg:         oklch(0.16 0.008 145);
      --surface:    oklch(0.21 0.010 145);
      --line:       oklch(0.30 0.012 145);
      --line-soft:  oklch(0.25 0.010 145);
      --ink:        oklch(0.97 0.004 145);
      --ink-muted:  oklch(0.75 0.012 145);
      --accent:     oklch(0.85 0.185 128);
      --accent-dim: oklch(0.78 0.170 128);
      --accent-ink: oklch(0.18 0.040 128);
      --ok:         oklch(0.82 0.150 150);
      --ok-bg:      oklch(0.26 0.055 150);
      --danger:     oklch(0.76 0.150 25);
      --danger-bg:  oklch(0.27 0.070 25);
      --r:          8px;
      --ease:       cubic-bezier(0.22, 1, 0.36, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 320px;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      font-size: 0.875rem;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Cabeçalho ─────────────────────────────────────────── */

    .head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.9375rem 1.125rem;
      border-bottom: 1px solid var(--line-soft);
    }

    .head h1 {
      font-size: 0.9375rem;
      font-weight: 650;
      letter-spacing: -0.01em;
    }

    /* Estado real e útil, em vez de um selo decorativo. */
    .keystate {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      font-size: 0.6875rem;
      font-weight: 500;
      color: var(--ink-muted);
      white-space: nowrap;
    }

    .keystate::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--line);
      transition: background 180ms var(--ease);
    }

    .keystate[data-saved="true"]::before { background: var(--accent); }

    /* ── Seções ────────────────────────────────────────────── */

    .section { padding: 1.0625rem 1.125rem; }
    .section + .section { border-top: 1px solid var(--line-soft); }

    .row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 0.4375rem;
    }

    label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--ink);
    }

    .reveal {
      background: none;
      border: 0;
      padding: 0;
      font: inherit;
      font-size: 0.6875rem;
      font-weight: 500;
      color: var(--ink-muted);
      cursor: pointer;
      border-radius: 4px;
      transition: color 150ms var(--ease);
    }

    .reveal:hover { color: var(--ink); }

    input {
      width: 100%;
      padding: 0.5625rem 0.6875rem;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r);
      color: var(--ink);
      font: inherit;
      font-size: 0.8125rem;
      outline: none;
      transition: border-color 150ms var(--ease);
    }

    input::placeholder { color: oklch(0.61 0.010 145); }
    input:hover { border-color: oklch(0.36 0.012 145); }

    .hint {
      margin-top: 0.4375rem;
      font-size: 0.6875rem;
      color: var(--ink-muted);
    }

    /* ── Botões ────────────────────────────────────────────── */

    .btn {
      width: 100%;
      padding: 0.5625rem;
      border-radius: var(--r);
      border: 0;
      font: inherit;
      font-size: 0.8125rem;
      font-weight: 650;
      cursor: pointer;
      transition: background 150ms var(--ease), color 150ms var(--ease);
    }

    /* Única ação do popup, então é a principal. */
    .btn-primary {
      margin-top: 0.75rem;
      background: var(--accent);
      color: var(--accent-ink);
    }

    .btn-primary:hover:not(:disabled)  { background: var(--accent-dim); }
    .btn-primary:active:not(:disabled) { background: oklch(0.71 0.155 128); }

    .btn:disabled {
      background: var(--surface);
      color: oklch(0.52 0.010 145);
      cursor: not-allowed;
    }

    .btn[data-busy="true"] {
      color: transparent;
      position: relative;
      pointer-events: none;
    }

    .btn[data-busy="true"]::after {
      content: '';
      position: absolute;
      inset: 0;
      margin: auto;
      width: 13px;
      height: 13px;
      border: 2px solid oklch(0.18 0.040 128 / 0.28);
      border-top-color: var(--accent-ink);
      border-radius: 50%;
      animation: spin 600ms linear infinite;
    }


    @keyframes spin { to { transform: rotate(360deg); } }

    /* Um único anel de foco para tudo que é focável. */
    input:focus-visible,
    .btn:focus-visible,
    .reveal:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    /* ── Retorno ───────────────────────────────────────────── */

    .status {
      margin-top: 0.625rem;
      padding: 0.5rem 0.6875rem;
      border-radius: var(--r);
      font-size: 0.75rem;
      border: 1px solid transparent;
      word-break: break-word;
    }

    .status:empty { display: none; }
    .status[data-kind="success"] { background: var(--ok-bg);     color: var(--ok);     border-color: oklch(0.36 0.075 150); }
    .status[data-kind="error"]   { background: var(--danger-bg); color: var(--danger); border-color: oklch(0.38 0.090 25); }

    /* ── Instruções ────────────────────────────────────────── */

    h2 {
      font-size: 0.75rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .steps {
      list-style: none;
      counter-reset: step;
      display: grid;
      gap: 0.375rem;
    }

    .steps li {
      counter-increment: step;
      display: grid;
      grid-template-columns: 1.125rem 1fr;
      gap: 0.5rem;
      font-size: 0.75rem;
      color: var(--ink-muted);
    }

    .steps li::before {
      content: counter(step);
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      color: oklch(0.55 0.010 145);
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition-duration: 1ms !important; animation-duration: 1ms !important; }
      .btn[data-busy="true"]::after { animation: none; border-top-color: transparent; }
    }
  </style>
</head>
<body>
  <header class="head">
    <h1>Bot Questões</h1>
    <span class="keystate" id="keystate" data-saved="false">Sem chave</span>
  </header>

  <section class="section">
    <div class="row">
      <label for="apiKey">Chave da API</label>
      <button type="button" class="reveal" id="revealBtn" aria-controls="apiKey">Mostrar</button>
    </div>

    <input type="password" id="apiKey" placeholder="Cole sua chave aqui" autocomplete="off" spellcheck="false" />
    <p class="hint">Guardada só neste navegador. Nunca é enviada a outro lugar.</p>

    <button type="button" class="btn btn-primary" id="saveBtn" disabled>Salvar chave</button>
    <p class="status" id="keyStatus" role="status" aria-live="polite"></p>
  </section>

  <section class="section">
    <h2>Como usar</h2>
    <ol class="steps">
      <li>Salve sua chave da Gemini acima.</li>
      <li>Abra a página do exercício e recarregue.</li>
      <li>Clique em <strong>Resolver quiz</strong>, no canto da tela.</li>
    </ol>
  </section>

  <script src="popup.js"></script>
</body>
</html>

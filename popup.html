<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bot Questões</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="head">
    <h1>Bot Questões</h1>
    <span class="keystate" id="keystate" data-saved="false">Sem chave</span>
  </header>

  <section class="section">
    <div class="row">
      <label for="apiKey">Chave da API</label>
      <button type="button" class="reveal" id="revealBtn" aria-controls="apiKey">Mostrar</button>
    </div>

    <input type="password" id="apiKey" placeholder="Cole sua chave aqui" autocomplete="off" spellcheck="false" />
    <p class="hint">Guardada só neste navegador. Nunca é enviada a outro lugar.</p>

    <button type="button" class="btn btn-primary" id="saveBtn" disabled>Salvar chave</button>
    <p class="status" id="keyStatus" role="status" aria-live="polite"></p>
  </section>

  <section class="section">
    <h2>Como usar</h2>
    <ol class="steps">
      <li><span>Salve sua chave da Gemini acima.</span></li>
      <li><span>Abra a página do exercício.</span></li>
      <li><span>Clique em <strong>Resolver quiz</strong>.</span></li>
    </ol>
  </section>

  <section class="section">
    <button type="button" class="btn btn-primary" id="solveBtn">Resolver quiz</button>
    <p class="status" id="solveStatus" role="status" aria-live="polite"></p>
  </section>

  <script src="popup.js"></script>
</body>
</html>
